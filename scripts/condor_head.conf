#cloud-config
write_files:
-   content: |
      CONDOR_HOST = localhost
      ALLOW_WRITE = *
      ALLOW_READ = *
      ALLOW_NEGOTIATOR = *
      DAEMON_LIST = COLLECTOR, MASTER, NEGOTIATOR, SCHEDD
      FILESYSTEM_DOMAIN = vgcn
      UID_DOMAIN = vgcn
      TRUST_UID_DOMAIN = True
      SOFT_UID_DOMAIN = True
    owner: centos:centos
    path: /etc/condor/condor_config.local
    permissions: '0644'

users:
      - name: galaxy_master
        sudo: ALL=(ALL) NOPASSWD:ALL
        uid: 1001
        ssh-authorized-keys:
           - ssh-rsa  igegu@blanca
           - ssh-rsa  ieguinoa@borat

