#cloud-config
write_files:
- content: |
        CONDOR_HOST = 10.10.4.
        ALLOW_WRITE = *
        ALLOW_READ = *
        ALLOW_ADMINISTRATOR = *
        ALLOW_NEGOTIATOR = *
        ALLOW_CONFIG = *
        ALLOW_DAEMON = *
        ALLOW_OWNER = *
        ALLOW_CLIENT = *
        DAEMON_LIST = MASTER, SCHEDD, STARTD
        FILESYSTEM_DOMAIN = vgcn
        UID_DOMAIN = vgcn
        TRUST_UID_DOMAIN = True
        SOFT_UID_DOMAIN = True
        # run with partitionable slots
        CLAIM_PARTITIONABLE_LEFTOVERS = True
        NUM_SLOTS = 1
        NUM_SLOTS_TYPE_1 = 1
        SLOT_TYPE_1 = 100%
        SLOT_TYPE_1_PARTITIONABLE = True
        ALLOW_PSLOT_PREEMPTION = False
        STARTD.PROPORTIONAL_SWAP_ASSIGNMENT = True
  owner: root:root
  path: /etc/condor/condor_config.local
  permissions: '0644'

users:
      - name: galaxy_master
        sudo: ALL=(ALL) NOPASSWD:ALL
        uid: 1001
        ssh-authorized-keys:
           - ssh-rsa  igegu@blanca
           - ssh-rsa  ieguinoa@borat


