# Logrotate config for ansible-deployment logs
# Install: sudo cp scripts/ansible-logrotate.conf /etc/logrotate.d/ansible-deployment
# Test:    sudo logrotate -d /etc/logrotate.d/ansible-deployment

/home/galaxy_master/usegalaxy-be-admin/ansible-galaxy-deployment/ansible-deployment/logs/ansible.log {
    weekly
    rotate 8
    compress
    delaycompress
    dateext
    dateformat -%Y%m%d
    missingok
    notifempty
    copytruncate
}
