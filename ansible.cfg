[defaults]
inventory = inventories/hosts, inventories/vib.openstack.yml
# Use the YAML callback plugin.
stdout_callback = yaml
roles_path = roles:../../infrastructure-playbook/roles
collections_path = collections:../../infrastructure-playbook/collections
# Use the stdout_callback when running ad-hoc commands.
bin_ansible_callbacks = True
vault_password_file = ~/.vault-pass.sh
transport = ssh
timeout=60
playbook_vars_root = top
# remote_tmp=/tmp/.ansible/tmp

# logger
log_path = logs/ansible.log


# Show diffs of changes
[diff]
always = True

[ssh_connection]
# enable pipelining with OpenSSH
pipelining = true
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ControlPath=/tmp/ansible-ssh-%h-%p-%r -o ServerAliveInterval=60 -o ForwardAgent=yes
scp_if_ssh = smart
transfer_method = smart


# [persistent_connection]
# command_timeout = 60 

[inventory]
enable_plugins = openstack, host_list, script, auto, yaml, ini, toml
