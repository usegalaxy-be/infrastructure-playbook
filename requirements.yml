---
collections:
  - name: grafana.grafana
    version: 5.3.0
    source: https://galaxy.ansible.com
    type: galaxy
  - name: community.grafana  # required by grafana.grafana for datasource/dashboard API tasks
    source: https://github.com/ansible-collections/community.grafana.git
    version: 2.0.0
    type: git
  - name: openstack.cloud
  - name: community.hashi_vault
    version: 5.0.1
    source: https://galaxy.ansible.com
    type: galaxy
  - name: community.docker
    version: 1.9.0
    source: https://galaxy.ansible.com
    type: galaxy
  - name: community.rabbitmq
    version: 1.1.0
    source: https://galaxy.ansible.com
    type: galaxy
  - name: devsec.hardening
    version: 8.7.0
    source: https://galaxy.ansible.com
    type: galaxy
  - name: usegalaxy_eu.handy
    version: 3.0.1
    source: https://galaxy.ansible.com
roles:
  # Galaxy, Postgres, Nginx
  - src: galaxyproject.galaxy
    version: 0.12.13  # 0.12.13 fixes 26.1 version detection (0.12.8 clobbers the result on the legacy-path skip); was 0.12.8, 0.11.2
  - src: galaxyproject.nginx
    version: 0.7.1
  - src: galaxyproject.postgresql
    version: 1.1.8
  - src: galaxyproject.postgresql_objects
    version: 1.2.0
  # install due to issues when running tools in containers?
  - src: galaxyproject.miniconda
    version: 0.3.1
  - name: usegalaxy-eu.ansible-postgresql
    src: https://github.com/usegalaxy-eu/ansible-postgresql
    version: main
  - src: usegalaxy_eu.certbot
    version: 0.1.13
  # gxadmin (used in cleanup, and later monitoring.)
  - src: galaxyproject.gxadmin
    version: 0.0.14
  # TUS (uploads)
  - name: galaxyproject.tusd
    version: 0.0.1
  - name: usegalaxy_eu.rustus
    version: 0.2.0
  # CVMFS Support
  - src: galaxyproject.cvmfs
    version: 0.2.21
  # Singularity
  - src: usegalaxy_eu.apptainer
    version: 0.0.3
    # SLURM as our DRM
  - src: galaxyproject.repos
    version: 0.0.3
    # NOTE: we currently do not use slurm
  # - src: galaxyproject.slurm
  #   version: 1.0.2
  - name: galaxyproject.self_signed_certs
    version: 0.0.4
  # TPV Linting
  - name: usegalaxy_eu.tpv_auto_lint
    src: https://github.com/usegalaxy-eu/ansible-tpv-lint
    version: deploy-configs
  - src: geerlingguy.pip
    version: 3.1.2
  # RabbitMQ for Pulsar
  - src: geerlingguy.docker
    version: 6.1.0
  - src: usegalaxy_eu.rabbitmqserver
    version: 1.4.5
  - src: usegalaxy_eu.htcondor
    version: 2.2.0
  - name: grycap.htcondor
    src: https://github.com/usegalaxy-eu/ansible-htcondor-grycap
    version: d9a4aab0052dfb31d48c986d39a7f5e3692abba4
  - src: galaxyproject.pulsar
    version: 1.0.10
  # Celery, Redis, and Flower (dashboard)
  - name: geerlingguy.redis
    version: 1.8.0
  - name: geerlingguy.repo-epel
    version: 3.1.0
  - name: usegalaxy_eu.flower
    version: 1.0.2
  - src: usegalaxy_eu.influxdb
    version: v6.0.7
  - name: usegalaxy_eu.influxdbserver
    version: 1.1.2
  # NOTE: Replaced by pdg.grafana, which is now replaced by grafana.grafana collection
  # - src: cloudalchemy.grafana
  #   version: 0.14.2
  # Training Infrastructure as a Service
  - src: galaxyproject.tiaas2
    version: 2.2.4
  # Monitoring
  - name: dj-wasabi.telegraf
    src: https://github.com/dj-wasabi/ansible-telegraf
    version: 6f6fdf7f5ead491560783d52528b79e9e088bd5b
  # Sentry
  - name: mvdbeek.sentry_selfhosted
    src: https://github.com/mvdbeek/ansible-role-sentry/archive/main.tar.gz
  # Our FTP Server
  - src: galaxyproject.proftpd
    version: 0.3.1
  - name: usegalaxy_eu.galaxy_systemd
    version: 2.1.0
  - name: usegalaxy-eu.autoupdates
    src: https://github.com/usegalaxy-eu/ansible-autoupdates
    version: 0.0.1
  - name: influxdata.chrony
    src: https://github.com/usegalaxy-eu/ansible-chrony
    version: 0.1.0
  - name: usegalaxy_eu.galaxy_subdomains
    version: 0.0.13
  - name: usegalaxy_eu.ansible_nginx_upload_module
    version: 1.0.0
  - name: galaxyproject.galaxy-tools
    src: https://github.com/galaxyproject/ansible-galaxy-tools
  - name: usegalaxy_eu.pulsar-util
    src: https://github.com/usegalaxy-eu/ansible-pulsar-util.git
    # src: https://github.com/rsiminel/ansible-pulsar-util.git
  - name: ansible-community.ansible-vault
    src: https://github.com/ansible-community/ansible-vault.git
    version: master
  - name: usegalaxy_eu.tpv_broker
    src: https://github.com/usegalaxy-eu/ansible-tpv-broker.git
  # Pinned to our fork/branch until usegalaxy-au/ansible-history-mailer#5 and #6
  # merge upstream (alembic migrations on every deploy, SMTP backend config).
  # Switch back to usegalaxy-au/ansible-history-mailer once both land.
  - name: usegalaxy_au.history_mailer
    src: https://github.com/usegalaxy-be/ansible-history-mailer.git
    version: main
  - name: geerlingguy.nfs
    version: 2.1.1
