---
# Read-only kernel report per host: running, newest installed, newest offered,
# and whether the running kernel meets kernel_minimum.
# -e save_report=true writes it to inventories/host_files/kernel_audit.txt.

- name: Audit fleet kernel versions
  hosts: all
  become: true
  gather_facts: true
  vars:
    save_report: false
  tasks:
    - name: Read the OS release
      ansible.builtin.slurp:
        src: /etc/os-release
      register: kernel_audit_osrelease

    - name: Find the newest installed kernel package
      ansible.builtin.shell: |
        set -o pipefail
        rpm -q kernel --qf '%{VERSION}-%{RELEASE}\n' 2>/dev/null | sort -V | tail -1
      args:
        executable: /bin/bash
      register: kernel_audit_installed
      changed_when: false
      failed_when: false

    - name: Find the newest kernel the repos offer
      ansible.builtin.shell: |
        set -o pipefail
        dnf -q list --showduplicates kernel 2>/dev/null | awk '/^kernel/ {print $2}' | sort -V | tail -1
      args:
        executable: /bin/bash
      register: kernel_audit_available
      changed_when: false
      failed_when: false

    - name: Pick the kernel minimum for this OS
      ansible.builtin.set_fact:
        kernel_audit_minimum: >-
          {{ {'9': kernel_minimum, '8': kernel_minimum_el8}.get(ansible_distribution_major_version, '')
             if 'elrepo' not in ansible_kernel else '' }}

    - name: Check whether the running kernel meets the minimum
      ansible.builtin.shell: |
        set -o pipefail
        running=$(uname -r | sed 's/\.x86_64$//')
        oldest=$(printf '%s\n%s\n' "{{ kernel_audit_minimum }}" "$running" | sort -V | head -1)
        test "$oldest" = "{{ kernel_audit_minimum }}"
      args:
        executable: /bin/bash
      register: kernel_audit_meets_minimum
      changed_when: false
      failed_when: false

    - name: Compare the running kernel with the newest installed package
      ansible.builtin.shell: |
        set -o pipefail
        running=$(uname -r | sed 's/\.x86_64$//')
        installed=$(rpm -q kernel --qf '%{VERSION}-%{RELEASE}\n' 2>/dev/null | sort -V | tail -1)
        if [ -z "$installed" ]; then
          echo "no-kernel-package-installed"
        elif [ "$running" = "$installed" ]; then
          echo "consistent"
        elif [ "$(printf '%s\n%s\n' "$running" "$installed" | sort -V | tail -1)" = "$installed" ]; then
          echo "NEWER-KERNEL-INSTALLED-PENDING-REBOOT"
        else
          echo "RUNNING-NEWER-THAN-ANY-INSTALLED-PACKAGE"
        fi
      args:
        executable: /bin/bash
      register: kernel_audit_rpm_state
      changed_when: false
      failed_when: false

    # Verdict words avoid yes/no/true/false, which Ansible coerces to booleans.
    - name: Derive the report fields
      ansible.builtin.set_fact:
        kernel_audit_os: >-
          {{ (kernel_audit_osrelease.content | b64decode).split('VERSION="')[1].split('"')[0]
             if 'VERSION="' in (kernel_audit_osrelease.content | b64decode) else 'unknown' }}
        kernel_audit_verdict: >-
          {{ 'no-minimum' if kernel_audit_minimum | length == 0
             else ('ok' if kernel_audit_meets_minimum.rc == 0 else 'BELOW-MINIMUM') }}

    - name: Build the per-host verdict
      ansible.builtin.set_fact:
        kernel_audit_line: "{{ inventory_hostname }} | os={{ kernel_audit_os | trim }} | running={{ ansible_kernel }} | installed={{ kernel_audit_installed.stdout | default('none') | trim }} | available={{ kernel_audit_available.stdout | default('unknown') | trim }} | minimum={{ kernel_audit_verdict | trim }} | rpm={{ kernel_audit_rpm_state.stdout | default('unknown') | trim }}"

    - name: Report
      ansible.builtin.debug:
        msg: "{{ kernel_audit_line }}"

- name: Write the collected report
  hosts: localhost
  gather_facts: false
  vars:
    save_report: false
  tasks:
    - name: Ensure the report directory exists
      ansible.builtin.file:
        path: "{{ playbook_dir }}/../../inventories/host_files"
        state: directory
        mode: '0755'
      when: save_report | bool

    - name: Save the report under inventories/host_files
      ansible.builtin.copy:
        dest: "{{ playbook_dir }}/../../inventories/host_files/kernel_audit.txt"
        mode: '0644'
        content: |
          Fleet kernel audit, generated by playbooks/one-off/kernel-audit.yml
          Kernel minimum: {{ hostvars[groups['all'][0]]['kernel_minimum'] | default('unset') }} (el9), {{ hostvars[groups['all'][0]]['kernel_minimum_el8'] | default('unset') }} (el8)

          {% for host in groups['all'] | sort %}
          {{ hostvars[host]['kernel_audit_line'] | default(host ~ ' | unreachable or skipped') }}
          {% endfor %}
      when: save_report | bool
