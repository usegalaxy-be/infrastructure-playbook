---
# Copy prod's conda environments and legacy tool dependencies to the shared dependencies directory.
# Conda environments contain their own path, so each one is cloned (paths rewritten), not copied.
# Packages come from the old package cache. Each finished environment gets a marker file;
# environments without one are cloned again, so the run can be repeated after an interruption.
#
# Installs Miniforge (conda-forge only) at the new path first, if it is missing.
# Needs the galaxy_shared autofs map:
#   ansible-playbook playbooks/infrastructure/nfs-client-mounts.yml --limit usegalaxy.be
# Usage, from tmux: the clone takes hours, and a second run while one is going stops with exit 3.
#   ansible-playbook playbooks/one-off/conda-copy-to-shared.yml
#   -e conda_copy_allow_failed=true   finish even if some environments failed (listed in the result)

- name: Copy conda environments to the shared path
  hosts: usegalaxy.be
  become: true
  become_user: "{{ galaxy_user_name }}"
  gather_facts: false
  vars:
    conda_copy_old: /srv/galaxy/shared/etc/dependencies
    conda_copy_new: "{{ galaxy_shared_data_dir }}/dependencies"
    conda_copy_allow_failed: false
    conda_copy_miniforge_version: 26.7.2-0
    conda_copy_miniforge_sha256: 281b0ac7d550802efc81af633225a5e6116d29ae72f3ab4eae7168c3931a4c05

  tasks:
    - name: Check the new conda is installed
      ansible.builtin.stat:
        path: "{{ conda_copy_new }}/miniconda3/bin/conda"
      register: conda_copy_bin

    - name: Install Miniforge
      when: not conda_copy_bin.stat.exists
      block:
        - name: Download the Miniforge installer
          ansible.builtin.get_url:
            url: "https://github.com/conda-forge/miniforge/releases/download/{{ conda_copy_miniforge_version }}/Miniforge3-{{ conda_copy_miniforge_version }}-Linux-x86_64.sh"
            dest: /tmp/miniforge-installer.sh
            checksum: "sha256:{{ conda_copy_miniforge_sha256 }}"
            mode: "0700"

        - name: Run the Miniforge installer
          ansible.builtin.command: bash /tmp/miniforge-installer.sh -b -p {{ conda_copy_new }}/miniconda3
          args:
            creates: "{{ conda_copy_new }}/miniconda3/bin/conda"
      always:
        - name: Remove the Miniforge installer
          ansible.builtin.file:
            path: /tmp/miniforge-installer.sh
            state: absent

    - name: Channels for the new conda
      ansible.builtin.copy:
        dest: "{{ conda_copy_new }}/miniconda3/.condarc"
        content: |
          channels:
            - conda-forge
            - bioconda
          channel_priority: strict
        mode: "0644"

    # flock: a second run exits instead of cloning in parallel
    - name: Clone each environment into the new conda
      ansible.builtin.shell: |
        set -u
        exec 9> "{{ conda_copy_new }}/conda-copy.lock"
        flock -n 9 || { echo "another copy is running"; exit 3; }
        export CONDA_PKGS_DIRS="{{ conda_copy_new }}/miniconda3/pkgs,{{ conda_copy_old }}/miniconda3/pkgs"
        failed_list="{{ conda_copy_new }}/conda-copy-failed.txt"
        : > "$failed_list"
        copied=0; skipped=0; failed=0
        for env in {{ conda_copy_old }}/miniconda3/envs/*/; do
          name=$(basename "$env")
          new="{{ conda_copy_new }}/miniconda3/envs/$name"
          if [ -f "$new/.copied" ]; then skipped=$((skipped+1)); continue; fi
          rm -rf "$new"
          if "{{ conda_copy_new }}/miniconda3/bin/conda" create --quiet --yes --prefix "$new" --clone "$env" \
              >> "{{ conda_copy_new }}/conda-copy.log" 2>&1; then
            touch "$new/.copied"; copied=$((copied+1))
          else
            rm -rf "$new"; echo "$name" >> "$failed_list"; failed=$((failed+1))
          fi
        done
        echo "copied=$copied skipped=$skipped failed=$failed"
      args:
        executable: /bin/bash
      async: 172800
      poll: 60
      register: conda_copy_result
      changed_when: "'copied=0 ' not in conda_copy_result.stdout"

    - name: Environments that failed to clone
      ansible.builtin.command: cat {{ conda_copy_new }}/conda-copy-failed.txt
      register: conda_copy_failed
      changed_when: false

    - name: Copy the legacy tool-dependencies tree
      ansible.builtin.command:
        cmd: rsync -a {{ conda_copy_old }}/tool-dependencies/ {{ conda_copy_new }}/tool-dependencies/
      changed_when: true

    - name: Point the legacy tool-dependencies env files at the new path
      ansible.builtin.shell: |
        grep -rlZ --include=env.sh "{{ conda_copy_old }}" "{{ conda_copy_new }}/tool-dependencies" \
          | xargs -0 -r sed -i "s#{{ conda_copy_old }}#{{ conda_copy_new }}#g"
      changed_when: true

    - name: Result
      ansible.builtin.debug:
        msg: "{{ conda_copy_result.stdout }}; failed: {{ conda_copy_failed.stdout_lines | join(', ') or 'none' }}"
      failed_when: conda_copy_failed.stdout_lines | length > 0 and not conda_copy_allow_failed | bool
