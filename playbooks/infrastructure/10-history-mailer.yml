---
# Deploy the inactive-history warn/delete/purge mailer to each Galaxy host. Each host
# acts on its own instance with its own admin API key (host_vars/<host>/vault) and
# sends mail via the existing Mailgun relay. Config: group_vars/galaxyservers/history_mailer.yml.
# Vendored from usegalaxy-au/history-mailer (see requirements.yml for the fork/branch
# pin and why). Staged rollout gates (all off/dry-run by default): see RFC00248.

- name: Galaxy history mailer
  hosts: galaxyservers
  become: true
  roles:
    - role: usegalaxy_au.history_mailer
