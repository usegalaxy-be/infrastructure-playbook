---
# NFS Server Setup
# ================
# Configures the NFS server: block device mount, directory structure,
# permissions, and NFS exports.
#
# NFS export structure on /data/share:
#   Shared across both environments (root_squash unless noted):
#     /data/share                          — parent (required for NFS)
#     /data/share/data_stage               — staging area
#     /data/share/shared_certs             — shared TLS certs (no_root_squash: certbot)
#     /data/share/shared_data              — shared reference data
#     /data/share/shared_data/tool_data    — shared tool_data_path
#     /data/share/shared_data/dependencies — shared non-venv tool dependencies
#     /data/share/shared_data/dm_data      — shared Data Manager reference data
#     /data/share/shared_data/local_tools  — shared local_tools pool (no_root_squash)
#
#   Per environment, identical subdirectory names under test_share/ and
#   prod_duplicate/ (root_squash unless noted):
#     database     — Galaxy mutable data dir
#     server       — Galaxy server code (no_root_squash: Ansible privsep writes)
#     venv         — Galaxy virtualenv (no_root_squash: Ansible privsep writes)
#     local_tools  — env-only local tools (no_root_squash)
#     tmp          — job working dirs (no_root_squash: Docker daemon root bind-mounts these)
#
# The shared_data/* and per-env server/venv/local_tools/tmp directories are
# additive relative to the exports already live in production (RFC00236) —
# existing paths (etc/, src/, database/tool-dependencies/, etc.) keep working
# unchanged through the parent /data/share export until their data migration
# actually runs.
#
# Exports are managed by geerlingguy.nfs via nfs_exports in group_vars/nfsservers/nfs.yml.
#
# Usage:
#   ansible-playbook playbooks/infrastructure/nfs-server-setup.yml

- name: Setup NFS Server
  hosts: nfsservers
  become: true
  gather_facts: true

  vars:
    # Explicit opt-in to format nfs_data_device — true only for a genuine
    # first-time setup, pass via -e rather than editing this default.
    nfs_data_device_format: false

  pre_tasks:
    - name: Apply common repo fixes (skip unavailable repos, refresh pgdg GPG key, fix openssl get_url bug)
      ansible.builtin.include_tasks: tasks/fix_repos.yml

    - name: Install filesystem utilities
      package:
        name:
          - xfsprogs
        state: present

    - name: Create /data/share mount point
      file:
        path: /data/share
        state: directory
        mode: "0755"

    - name: Format block device as XFS (first-time setup only, requires nfs_data_device_format)
      filesystem:
        fstype: xfs
        dev: "{{ nfs_data_device }}"
        force: false
      when: nfs_data_device_format | bool

    - name: Mount /data/share
      mount:
        path: /data/share
        src: "{{ nfs_data_device }}"
        fstype: xfs
        opts: defaults,nofail
        state: mounted

    - name: Create NFS directory structure
      file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /data/share/data_stage
        - /data/share/shared_certs
        - /data/share/shared_data
        - /data/share/shared_data/tool_data
        - /data/share/shared_data/dependencies
        - /data/share/shared_data/dm_data
        - /data/share/shared_data/local_tools
        # Test environment
        - /data/share/test_share
        - /data/share/test_share/database
        - /data/share/test_share/tmp
        - /data/share/test_share/server
        - /data/share/test_share/venv
        - /data/share/test_share/local_tools
        # Prod environment
        - /data/share/prod_duplicate
        - /data/share/prod_duplicate/database
        - /data/share/prod_duplicate/server
        - /data/share/prod_duplicate/venv
        - /data/share/prod_duplicate/local_tools
        - /data/share/prod_duplicate/tmp

  roles:
    - role: geerlingguy.nfs

    # System metrics (CPU/mem/disk/net) -> InfluxDB. Output config
    # (telegraf_agent_output etc.) inherited from the telegrafservers group
    # (nfsservers is a member, see inventories/hosts).
    - role: dj-wasabi.telegraf

  tasks:
    # geerlingguy.nfs doesn't manage nfsd thread count; stock default (8) leaves
    # most vCPUs idle on a metadata/IO-bound workload.
    - name: Set nfsd thread count
      ansible.builtin.lineinfile:
        path: /etc/nfs.conf
        regexp: '^#?\s*threads\s*='
        line: "threads={{ nfs_server_threads }}"
        insertafter: '^\[nfsd\]'
      notify: Restart nfs-server

    - name: Open NFS in firewall
      firewalld:
        service: nfs
        permanent: true
        state: enabled
        immediate: true
      ignore_errors: true  # firewalld may not be running

    # Historical CPU/IO/network/load metrics (sar), so a future NFS-server
    # slowdown leaves a trace. The old EOL CentOS 7 box had neither sysstat nor
    # working telegraf, which is why the 2026-07-14 incident could not be pinned.
    - name: Install sysstat (sar)
      package:
        name: sysstat
        state: present

    - name: Enable sysstat collection (samples every 10 min, daily summary)
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: true
        state: started
      loop:
        - sysstat.service
        - sysstat-collect.timer
        - sysstat-summary.timer

  handlers:
    - name: Restart nfs-server
      ansible.builtin.systemd:
        name: nfs-server
        state: restarted
