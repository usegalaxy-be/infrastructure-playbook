
# usegalaxy_eu.certbot 

# config from https://training.galaxyproject.org/training-material/topics/admin/tutorials/ansible-galaxy/tutorial.html#nginx
# usegalaxy_eu.certbot Installs certbot and requests SSL certificates
# The certbot role installs a cron job which checks if the certificate needs to be renewed (when it has <30 days of lifetime left) 
# and attempts to renew the certificate as needed.

server_names:
  - "usegalaxy.be"
  # - "*.usegalaxy.be"
  - "www.usegalaxy.be"
  - "test.usegalaxy.be"
  - "biodiversity.usegalaxy.be"
  - "monitoring.usegalaxy.be"
  # - "covid19.usegalaxy.be"

certbot_admin_email: paul.degeest@vib.be
# certbot_virtualenv_package_name: python3-virtualenv
# certbot_virtualenv_command: "python3.9 -m venv"

certbot_auto_renew_hour: "{{ 23 |random(seed=inventory_hostname)  }}"
certbot_auto_renew_minute: "{{ 59 |random(seed=inventory_hostname)  }}"
certbot_auth_method: --webroot
certbot_install_method: virtualenv
certbot_auto_renew: true
certbot_auto_renew_user: root
certbot_environment: production
certbot_well_known_root: /srv/nginx/_well-known_root
# automatically shares the certificates with any system users that might need to access them
certbot_share_key_users:
  - nginx
  # - www-data
  # - proftpd
  # - rabbitmq
  # - influxdb
certbot_share_key_ids:
  - "999:999"
# All server_names are SANs on the single {{ galaxy_shared_cert_domain }} lineage,
# so only that lineage is synced to NFS. Certbot's live/ files are root-only
# symlinks into archive/, hence the two-step copy: root dereferences them into
# temp_certs, then galaxy_master (who can write the root-squashed NFS mount)
# publishes to the shared location. Consumers (nginx vhosts, RabbitMQ, InfluxDB
# on the Galaxy heads) are reloaded/restarted through the forced-command SSH
# key deployed by 00-proxy.yml — the remote side decides what to run.
certbot_post_renewal: |
    systemctl reload nginx || true
    su - {{ galaxy_user_name }} -c "mkdir -p {{ galaxy_user_home }}/temp_certs/{{ galaxy_shared_cert_domain }}"
    su - {{ galaxy_user_name }} -c "chmod 750 {{ galaxy_user_home }}/temp_certs"
    rsync -rLptgoDz --chown={{ galaxy_user_name }}:{{ galaxy_user_name }} --delete /etc/letsencrypt/live/{{ galaxy_shared_cert_domain }}/ {{ galaxy_user_home }}/temp_certs/{{ galaxy_shared_cert_domain }}/
    su - {{ galaxy_user_name }} -c "rsync -az --delete {{ galaxy_user_home }}/temp_certs/{{ galaxy_shared_cert_domain }}/ {{ shared_certs_dir }}/live/{{ galaxy_shared_cert_domain }}/"
    su - {{ galaxy_user_name }} -c "mkdir -p {{ shared_certs_dir }}/user/{{ galaxy_shared_cert_domain }}"
    su - {{ galaxy_user_name }} -c "chmod 755 {{ shared_certs_dir }}/user/{{ galaxy_shared_cert_domain }}"
    su - {{ galaxy_user_name }} -c "rsync -azL {{ shared_certs_dir }}/live/{{ galaxy_shared_cert_domain }}/privkey.pem {{ shared_certs_dir }}/user/{{ galaxy_shared_cert_domain }}/privkey-nginx.pem"
    su - {{ galaxy_user_name }} -c "chmod 644 {{ shared_certs_dir }}/user/{{ galaxy_shared_cert_domain }}/privkey-nginx.pem"
    {% for host in cert_renewal_consumer_hosts %}
    ssh -i {{ cert_renewal_key_path }} -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=no {{ galaxy_user_name }}@{{ host }} refresh-certs || true
    {% endfor %}

# Dedicated key the renewal hook uses to reach the Galaxy heads; generated by
# 00-proxy.yml and authorized there with a forced command (refresh-certs only).
cert_renewal_key_path: /etc/ssl/cert-renewal-key
cert_renewal_consumer_hosts:
  - usegalaxy.be
  - test.usegalaxy.be

# domains that are requested for verification
certbot_domains: "{{ server_names }}"
certbot_agree_tos: --agree-tos
certbot_expand: false

# galaxyproject.nginx

# variables for nginx role, which sets up the monitoring proxy and other proxies as needed
base_hostname: "*.usegalaxy.be"
subdomains:
  - www.usegalaxy.be
  - usegalaxy.be
  - test.usegalaxy.be
  - biodiversity.usegalaxy.be
  # - covid19.usegalaxy.be

# nginx_remove_default_vhost: true

# CentOS hosts where Nginx will need to access Galaxy
nginx_servers:
  - redirect-ssl
nginx_ssl_servers:
  - subdomain-proxy
  - galaxy-test-gxit-proxy
  - monitoring-proxy
  # - galaxy-proxy
  # - sentry-proxy
  # - galaxy-test-proxy
  # - biodiversity-proxy

# Galaxy Interactive Tools proxy SSL cert paths for *.ep.interactivetool.test.usegalaxy.be
# Self-signed cert generated by 00-proxy.yml pre-task.
# To transition to a real cert (e.g. Let's Encrypt DNS-01), update these paths
# to the certbot live directory and re-run 00-proxy.yml.
gxit_test_ssl_certificate: /etc/ssl/certs/ep.interactivetool.test.usegalaxy.be.crt
gxit_test_ssl_certificate_key: /etc/ssl/private/ep.interactivetool.test.usegalaxy.be.key
gxit_proxy_port: 4002

nginx_ssl_role: usegalaxy_eu.certbot
# Location of the certificate / private key
nginx_conf_ssl_certificate: /etc/ssl/certs/fullchain.pem
nginx_conf_ssl_certificate_key: /etc/ssl/user/privkey-nginx.pem