# Secrets fetched from HashiCorp Vault at playbook runtime.
# Requires: VAULT_ADDR and VAULT_TOKEN (or ANSIBLE_HASHI_VAULT_* AppRole variables).
_vault_users: "{{ lookup('community.hashi_vault.hashi_vault', 'vsc/prod/data/usegalaxy-be/users') }}"
vault_galaxy_master_console_password: "{{ _vault_users.vault_galaxy_master_console_password }}"
vault_rocky_console_password: "{{ _vault_users.vault_rocky_console_password }}"
