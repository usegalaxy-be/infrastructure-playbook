# geerlingguy.redis

redis_bind_interface: 0.0.0.0
galaxy_additional_venv_packages:
  - redis
  - python-irodsclient
  - watchdog

# pdg.flower

flower_user: "{{ galaxy_user.name }}"
flower_group: "{{ galaxy_group.name }}"
flower_python_version: python3.9
flower_galaxy_conf: "{{ galaxy_config_dir }}/galaxy.yml"
flower_app_dir: "{{ galaxy_shared_root }}"
flower_python_path: "{{ galaxy_server_dir }}/lib"
flower_venv_dir: "{{ galaxy_venv_dir }}"
flower_app_name: galaxy.celery
flower_db_file: "{{ galaxy_config_dir }}/flower.db"
flower_persistent: true
flower_broker_api: "https://flower:{{ vault_rabbitmq_password_flower }}@0.0.0.0:5671/api/"
flower_broker_url: "amqp://flower:{{ vault_rabbitmq_password_flower }}@0.0.0.0:5671/galaxy_internal?ssl=true"
flower_proxy_prefix: /flower
flower_privsep_user: "{{ galaxy_privsep_user }}"

flower_ui_users:
  - name: admin
    password: "{{ vault_flower_user_password }}"

flower_environment_variables:
  GALAXY_CONFIG_FILE: "{{ galaxy_config_file }}"
