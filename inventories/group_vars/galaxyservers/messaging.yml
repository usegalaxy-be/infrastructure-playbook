---

# Pulsar config on galaxy machine
# TODO: set up a pulsar node https://training.galaxyproject.org/training-material/topics/admin/tutorials/pulsar/tutorial.html

# For each new Pulsar server, you will need to add:
# In the RabbitMQ config:
# - A vhost
# - A user - configured with a password and the new vhost
# In the Galaxy job configuration
# - A new job runner with the new connection string
# - A new destination or multiple destinations for the new runner.

# pdg.rabbitmqserver

# RabbitMQ
rabbitmq_container:
  name: rabbit_hole
  image: rabbitmq:3.11-management
  hostname: "{{ inventory_hostname }}"

rabbitmq_plugins:
  - rabbitmq_management

# NOTE: currently manually setting permission on certs for them to be accessible by rabbit
# NOTE: docker container by default only has access to /etc/ssl for certs, so the certs either
# need to be here or the path has to be added to the docker mounts
rabbitmq_config:
  listeners:
    tcp: none
  ssl_listeners:
    default: 5671
  ssl_options:
    verify: verify_peer
    cacertfile: "{{ galaxy_shared_certs_dir }}/{{ galaxy_shared_cert_domain }}/fullchain.pem" #"/etc/ssl/certs/fullchain.pem" 
    certfile: "{{ galaxy_shared_certs_dir }}/{{ galaxy_shared_cert_domain }}/cert.pem" #/etc/ssl/certs/cert.pem 
    keyfile: "{{ galaxy_shared_certs_user_dir }}/{{ galaxy_shared_cert_domain }}/privkey-nginx.pem" #/etc/ssl/user/privkey-999:999.pem
    fail_if_no_peer_cert: "false"
  management_agent:
    disable_metrics_collector: "false"
  management:
    disable_stats: "false"
  consumer_timeout: 21600000 # 6 hours in milliseconds

rabbitmq_container_standalone_setup_details:
  volumes:
    - "{{ rabbitmq_path }}/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro"
    - "{{ rabbitmq_path }}/.erlang.cookie:/var/lib/rabbitmq/.erlang.cookie"
    - /etc/ssl:/etc/ssl:ro
    - /etc/pki:/etc/pki:ro
    - "{{ galaxy_shared_certs_dir }}/{{ galaxy_shared_cert_domain }}:{{ galaxy_shared_certs_dir }}/{{ galaxy_shared_cert_domain }}:ro"
    - "{{ galaxy_shared_certs_user_dir }}/{{ galaxy_shared_cert_domain }}:{{ galaxy_shared_certs_user_dir }}/{{ galaxy_shared_cert_domain }}:ro"
  ports:
    - 15672:15672
    - 5671:5671

