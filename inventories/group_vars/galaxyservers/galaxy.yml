# hxr.install-to-venv
# role can be replaced by relevant task in galaxyproject.galaxy role

pip_venv_path: "{{ galaxy_venv_dir }}"
pip_install_dependencies:
    # Needed for tool watching
    # - galaxy-app
    # - galaxy-util
    # - galaxy-schema
    # - watchdog
    # ephemeris comes with a different version of pydantic and therefore needs to be installed in a seperate env
    # - ephemeris
    # dependency for v24.1 for BYOS
    # - boto3==1.34.106

# usegalaxy_eu.tpv_auto_lint

tpv_config_dir: "{{ galaxy_config_dir }}/{{ tpv_config_dir_name }}"
tpv_config_dir_name: tpv_config
tpv_configs:
  - '{{ galaxy_config_template_src_dir }}/tpv/tool_defaults.yml.j2'
  # - '{{ galaxy_config_template_src_dir }}/tpv/destinations_shared.yml.j2'
  - '{{ galaxy_config_template_src_dir }}/tpv/destinations.yml.j2' #'{{ galaxy_config_template_src_dir }}/{{ inventory_hostname }}/tpv/destinations.yml.j2'
  - '{{ galaxy_config_template_src_dir }}/tpv/tools.yml.j2'
  - '{{ galaxy_config_template_src_dir }}/tpv/users.yml.j2'
  - '{{ galaxy_config_template_src_dir }}/tpv/roles.yml.j2'
  - '{{ galaxy_config_template_src_dir }}/tpv/interactive_tools.yml.j2'

# TODO: needs to be created on nfs
galaxy_extra_privsep_dirs:
  - "{{ tpv_config_dir }}"
tpv_privsep: false
galaxy_job_config_file: "{{ galaxy_config_dir }}/galaxy.yml"

# Workaround for the sra_tools wrapper's ms/s http timeout bug — see the sra_tools
# rule in tpv/tools.yml.j2 and usegalaxy-be/infrastructure-playbook#172.
sra_tools_ncbi_override_path: "{{ galaxy_mutable_data_dir }}/tmp/sra_tools_ncbi_override.kfg"

legacy_data_manager_data_path: "/galaxy_base/scratch_prod/dm-data/"

# TODO: We need a consistent way of having the same data available on all nodes, 
# including pulsar nodes, for singularity and docker containers. Currently we rsync custom reference data to pulsar.
galaxy_container_volumes:
  local:
    - "$_CONDOR_SCRATCH_DIR:rw"
    - "$galaxy_root:ro"
    - "{{ galaxy_dependency_dir }}:ro"
    - "{{ galaxy_venv_dir }}:ro"
    - "{{ galaxy_tus_upload_store }}:rw"
    - "$tool_directory:ro"
    - "$working_directory:rw"
    - "$job_directory:rw"
    - "$job_directory/outputs:rw"
    - "$job_directory/tmp:rw"
    - "{{ galaxy_object_store_cache_path }}:ro"
    - "{{ galaxy_file_path }}:ro"
    - "{{ old_galaxy_file_path }}:ro"
    - "{{ galaxy_data_manager_data_path }}:ro"
    #- "{{ legacy_data_manager_data_path }}:ro"
    - "/srv/galaxy/shared/database/reference_data:ro"
    - "/cvmfs/data.galaxyproject.org:ro"
  # Same as 'local' but without $_CONDOR_SCRATCH_DIR, which HTCondor sets and
  # local_runner jobs never have. Scratch space is already covered by
  # $working_directory/$job_directory below. Also drops
  # /srv/galaxy/shared/database/reference_data: that's condor-worker-only NFS,
  # not mounted on the Galaxy handler itself.
  headnode:
    - "$galaxy_root:ro"
    - "{{ galaxy_dependency_dir }}:ro"
    - "{{ galaxy_venv_dir }}:ro"
    - "{{ galaxy_tus_upload_store }}:rw"
    - "$tool_directory:ro"
    - "$working_directory:rw"
    - "$job_directory:rw"
    - "$job_directory/outputs:rw"
    - "$job_directory/tmp:rw"
    - "{{ galaxy_object_store_cache_path }}:ro"
    - "{{ galaxy_file_path }}:ro"
    - "{{ old_galaxy_file_path }}:ro"
    - "{{ galaxy_data_manager_data_path }}:ro"
    - "/cvmfs/data.galaxyproject.org:ro"
  vib:
    - "$_CONDOR_SCRATCH_DIR:rw"
    - "$galaxy_root:ro"
    - "{{ galaxy_dependency_dir }}:ro"
    - "{{ galaxy_venv_dir }}:ro"
    - "{{ galaxy_tus_upload_store }}:rw"
    - "$tool_directory:ro"
    - "$working_directory:rw"
    - "$job_directory:rw"
    - "$job_directory/outputs:rw"
    - "$job_directory/tmp:rw"
    - "{{ galaxy_object_store_cache_path }}:ro"
    - "{{ galaxy_file_path }}:ro"
    - "{{ old_galaxy_file_path }}:ro"
    - "{{ galaxy_data_manager_data_path }}:ro"
    # - "{{ legacy_data_manager_data_path }}:ro"
    - "/srv/galaxy/shared/database/reference_data:ro"
    - "/cvmfs/data.galaxyproject.org:ro"
