---
# pdg.galaxy_webhooks: messages shown above a tool form (format in the role defaults).
# Recommendations come from usegalaxy.eu, kept where we have both tools.

galaxy_webhooks_toolmsg_anonymous_message: >
  <strong>You are not logged in.</strong> Your history and results are linked to this browser only
  and can be lost. <a href="/login/start">Log in or register</a> to keep your work.

galaxy_webhooks_toolmsg_messages:
  - tool_id: interactive_tool_napari
    class: warning
    message: >
      <strong>Napari does not work in every browser, for example Google Chrome.
      If it does not load, please use Firefox.</strong>

  - tool_id: toolshed.g2.bx.psu.edu/repos/iuc/annotatemyids/annotatemyids
    class: warning
    message: >
      <strong>We recommend using <a href="/?tool_id=gprofiler_convert">gProfiler Convert</a> instead.
      It is faster and supports more organisms.</strong>

  - tool_id: toolshed.g2.bx.psu.edu/repos/devteam/fastqc/fastqc
    class: warning
    message: >
      <strong>We recommend using <a href="/?tool_id=falco">Falco</a> instead.
      Falco is 3 times faster and offers the same functionality as FastQC.</strong>

  - tool_id: toolshed.g2.bx.psu.edu/repos/devteam/sam_merge/sam_merge2
    class: warning
    message: >
      <strong>This tool is deprecated. Please use <a href="/?tool_id=samtools_merge">samtools merge</a> instead.</strong>

  - tool_id: toolshed.g2.bx.psu.edu/repos/devteam/ncbi_blast_plus/ncbi_blastp_wrapper
    class: warning
    message: >
      <strong>We recommend using <a href="/?tool_id=bg_diamond">Diamond</a> instead.
      Pairwise alignment of proteins and translated DNA can be up to 100x-10,000x faster than BLAST.</strong>

  - tool_id: toolshed.g2.bx.psu.edu/repos/artbio/concatenate_multiple_datasets/cat_multi_datasets
    class: warning
    message: >
      <strong>This tool is deprecated. Please use one of these tools instead:
      <ul><li><a href="/?tool_id=cat1">Concatenate multiple datasets or collections</a></li>
      <li><a href="/?tool_id=toolshed.g2.bx.psu.edu/repos/bgruening/text_processing/tp_cat">Concatenate datasets tail-to-head (cat)</a></li></ul>
      See also: <a href="https://training.galaxyproject.org/faqs/galaxy/analysis_concatenate.html">FAQ: Pick the right Concatenate tool</a>.</strong>
