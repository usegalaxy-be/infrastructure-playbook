# PostgreSQL PITR Backups
# Base backups and WAL archive are pushed via rsync over SSH to the NFS server.
# The NFS server's IP (_nfs_ip, below) is used for data transfers.
# postgresql_backup_dir_is_remote evaluates to true for non-'/' paths, which
# enables the remote rsync branch in archive_wal.sh and skips --clean-archive in backup.py.
postgresql_backup_dir: "pgbackup@{{ _nfs_ip }}:/data/share/pg_backups"
postgresql_backup_rsync_connect_opts: >-
  -e 'ssh -i /var/lib/pgsql/.ssh/id_ed25519
  -o StrictHostKeyChecking=yes
  -o BatchMode=yes'
# Scripts (archive_wal.sh, backup.py) are installed here, local to the DB server.
# Note: "'~postgres' | expanduser" was not being processed as /var/lib/pgsql for some reason
postgresql_backup_local_dir: /var/lib/pgsql/backups
