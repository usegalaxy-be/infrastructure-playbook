#### Environment stuff

inventory_hostname: usegalaxy.be
galaxy_instance_hostname: usegalaxy.be
galaxy_instance_codename: main
galaxy_base_dir: /srv/galaxy
galaxy_commit_id: release_26.1 # advance stepwise: 25.0 → 25.1 → 26.0; only advance after test is validated at each step
galaxy_brand: "Belgium"
server_hostname: "{{ galaxy_instance_hostname }}"

galaxy_install_database_connection: "sqlite:///{{ galaxy_mutable_data_dir }}/shed_data/shed_database/universe.sqlite?isolation_level=IMMEDIATE"
# Filesystem path of the root of a Galaxy deployment, the Galaxy server code will be installed in to a subdirectory of this directory.
galaxy_root: /srv/galaxy

# Filesystem path where the Galaxy server code will be installed (cloned)
galaxy_server_dir: "{{ galaxy_shared_root }}/server"

# Galaxy's virtualenv directory. Versioned by Python version so a new venv is only
# created when the Python interpreter changes — old Galaxy keeps serving while the new
# venv is built alongside it, then galaxyctl graceful switches over with no downtime.
galaxy_venv_dir: "{{ galaxy_shared_root }}/venv/venv-py{{ galaxy_python_version }}"

# Node-local RAM (tmpfs) copy of this env's Galaxy lib+venv on the condor workers
# (see roles/pdg.galaxy_code_tmpfs). Per-env mount so test/prod stay isolated on
# the shared workers. `_enabled: false` keeps the TPV env override off until the
# workers are rolled out; flip to true to activate.
galaxy_code_tmpfs_mount: /opt/galaxy_prod
galaxy_code_tmpfs_enabled: true

# Non-venv tool dependencies, shared between prod and test (see shared_deps mount)
galaxy_dependency_dir: "{{ galaxy_shared_root }}/shared_deps"
galaxy_tool_dependency_dir: "{{ galaxy_shared_root }}/shared_deps/tool-dependencies"

# List of tool configs to load
galaxy_tool_config_files:
  - "{{ galaxy_config_dir }}/tool_conf.xml"
  - "{{ galaxy_shed_tool_conf_file }}"
  - "{{ galaxy_config_dir }}/shared_local_tool_conf.xml"
  # - "{{ shared_tool_conf_file | default('') }}"
  # - "{{ galaxy_server_dir }}/config/tool_conf.xml.sample"
  # - "{{ galaxy_config_dir }}/interactive_tools_conf.xml"

# Directory on the Galaxy server where env-only local tools will be installed
# (the common tool pool lives separately, see galaxy_shared_local_tools_dir).
# Nothing prod-only right now.
galaxy_local_tools_dir: "{{ galaxy_shared_root }}/local_tools"
galaxy_local_tools: []

# Directory to store Data Manager based tool-data. Shared between prod and test
# (see shared_dm_data mount) — reference data, not env-specific state.
galaxy_data_manager_data_path: "{{ galaxy_shared_root }}/shared_dm_data"

# TODO: can be shared between prod and test
galaxy_shed_tools_dir: "{{ galaxy_shared_root }}/database/shed_data/shed_tools"

# NOTE: these paths are used by object_store_conf.xml
# previously: galaxy_file_path: "{{galaxy_mutable_data_dir}}/files"
# NOTE: currently the primary storage location is tier-1 data but we still need these to retrieve old user data
# TODO: unify between test and prod
old_galaxy_file_path: "{{ galaxy_mutable_data_dir }}/files"
galaxy_file_path: "{{ galaxy_mutable_data_dir }}/objects"
# tmp/* paths live on a dedicated NFS mount (prod_duplicate/tmp, no_root_squash) separate
# from the database mount. This allows Docker daemon (root) to bind-mount job working dirs
# into containers without NFS root_squash blocking it. Mirrors test layout.
galaxy_tmp_dir: "{{ galaxy_shared_root }}/tmp/temp"

# Where temporary files are stored. It must be accessible at the same
# path on any cluster nodes that will run Galaxy jobs
galaxy_new_file_path: "{{ galaxy_shared_root }}/tmp/scratch"

# Each job is given a unique empty directory as its current working
# directory. This option defines in what parent directory those
# directories will be created.
galaxy_job_working_directory: "{{ galaxy_shared_root }}/tmp/jobs"
# NOTE: unused
# galaxy_cluster_files_directory: "{{ galaxy_shared_root }}/tmp/pbs"

# Top level cache directory. Any other cache directories (tool_cache_data_dir, template_cache_path, etc.)
# should be subdirectories.
galaxy_cache_dir: "{{ galaxy_mutable_data_dir }}/cache"

# TODO: implement a local disk (not NFS) iRODS object store cache to avoid double network hop
# galaxy_irods_cache_path: "{{ galaxy_local_root }}/object_store_cache"

# tpv vars
# Pulsar VIB job directory
galaxy_pulsar_vib_job_dir: /data/share
alphafold_db_path: "{{ galaxy_mutable_data_dir }}/alphafold_db"

# Galaxy Interactive Tools: base domain for subdomain routing.
# Galaxy constructs tool URLs as <ep_token>.ep.interactivetool.test.usegalaxy.be
# For production, set to: ep.interactivetool.usegalaxy.be
interactivetools_proxy_host: ep.interactivetool.usegalaxy.be

# condor vars
internal_address: "{{ lookup('community.hashi_vault.hashi_vault', 'vsc/prod/data/usegalaxy-be/network/device_ips').usegalaxy_be_ip }}"
condor_cm: "{{ lookup('community.hashi_vault.hashi_vault', 'vsc/prod/data/usegalaxy-be/network/device_ips').usegalaxy_be_ip }}"
#/32

