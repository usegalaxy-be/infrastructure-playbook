  #   config:
  #     - commands = [
  #       "{{ consumer_venv_dir }}/bin/python {{ pulsar_consumer_dir }}/pulsar_metric_consumer.py {{ consumer_galaxy_job_conf }} {{ consumer_destinations | join(',') }}",
  #       ]
  #     - timeout = "10s"
  #     - data_format = "influx"
  #     - interval = "1m"
  #   tags:
  #     - destination = "esg"

  # TODO: remove old monitor commands from igegu.monitoring and use hxr.monitor-cluster instead
#   condor_monitor:
#     plugin: exec
#     config:
#  #     - commands = [ "python /usr/local/galaxy/galaxy-monit/galaxy_queue_size.py", "python /usr/local/galaxy/galaxy-monit/iostat.py","bash /usr/local/galaxy/galaxy-monit/cluster_queue-condor.sh",
#  #        "bash /usr/local/galaxy/galaxy-monit/cluster_util-condor.sh",]
#       - commands = [ "bash /usr/local/galaxy/galaxy-monit/cluster_queue-condor.sh","bash /usr/local/galaxy/galaxy-monit/cluster_util-condor.sh",]
#       - timeout = "10s"
#       - data_format = "influx"
