# Monitoring
# usegalaxy_eu.influxdbserver

# influx_url: https://usegalaxy.be:59086
influx_port: 59086

# TODO: this variable needs to loaded by the role, make a PR
influxdb_databases:
  - galaxy
  - grt
  - galaxy_stats
  - notifications
  - internal_metrics

# Service accounts left out of the tool usage counts (galaxy-tool-usage)
galaxy_tool_usage_excluded_users:
  - tool_admin
  - tool-tests

# Role: dj-wasabi.telegraf

telegraf_agent_output:
  - type: influxdb
    config:
      - urls = ["http://monitoring.usegalaxy.be:8086"]
      - database = "galaxy"
      - username = "{{ influxdb_users.regular[1].username }}"
      - password = "{{ influxdb_users.regular[1].password }}"
      - timeout = "10s"
    tagdrop:
      - dest = ["internal_metrics"]
  # Internal metrics (institution/center breakdowns) go to a separate database
  # so the internal-metrics Grafana dashboard can query them independently.
  - type: influxdb
    config:
      - urls = ["http://monitoring.usegalaxy.be:8086"]
      - database = "internal_metrics"
      - username = "{{ influxdb_users.regular[1].username }}"
      - password = "{{ influxdb_users.regular[1].password }}"
      - timeout = "10s"
    tagpass:
      - dest = ["internal_metrics"]

telegraf_plugins_extra:
  postgres:
    plugin: "postgresql_extensible"
    config:
      - address = "{{ galaxy_db_connection }}"
      # TODO: move to vault?
      - databases = ["{{ vault_prod_db_name }}"]

  listen_galaxy_routes:
    plugin: "statsd"
    config:
      - service_address = ":8125"
      - percentiles = [90]
      - metric_separator = "."
      - allowed_pending_messages = 10000
      - percentile_limit = 100
  
  # telegraf plugin for sending pulsar metrics to influx
  # condor_monitor:
