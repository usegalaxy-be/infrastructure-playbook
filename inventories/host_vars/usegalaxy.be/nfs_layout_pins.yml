---
# Keeps prod on its current NFS paths until the prod window of the NFS layout RFC.
# Loaded after galaxy.yml, so these values win. Deleting this file switches prod to the new layout.

galaxy_server_dir: "{{ galaxy_shared_root }}/src"
galaxy_venv_dir: "{{ galaxy_shared_root }}/etc/venv-py{{ galaxy_python_version }}"
galaxy_dependency_dir: "{{ galaxy_shared_root }}/etc/dependencies"
galaxy_tool_dependency_dir: "{{ galaxy_shared_root }}/etc/dependencies/tool-dependencies"
galaxy_tool_data_path: "{{ galaxy_mutable_config_dir }}/tool_data"
galaxy_data_manager_data_path: "{{ galaxy_mutable_data_dir }}/reference_data/dm_data"
galaxy_local_tools_dir: "{{ galaxy_mutable_data_dir }}/local_tools"
miniconda_version: latest
miniconda_channels: []

