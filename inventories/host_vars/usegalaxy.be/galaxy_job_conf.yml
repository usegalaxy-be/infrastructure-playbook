# Galaxy Job Configuration
galaxy_job_config:
  runners:
    local_runner:
      load: galaxy.jobs.runners.local:LocalJobRunner
      workers: 4
    condor:
      load: galaxy.jobs.runners.condor:CondorJobRunner
    pulsar_embedded:
      load: galaxy.jobs.runners.pulsar:PulsarEmbeddedJobRunner
      pulsar_config: "{{ galaxy_config_dir }}/pulsar_app.yml"
    pulsar_vib:
      load: galaxy.jobs.runners.pulsar:PulsarMQJobRunner
      amqp_url: "pyamqp://galaxy_vib:{{ vault_rabbitmq_password_vib }}@127.0.0.1:5671//pulsar/galaxy_vib?ssl=1"
      amqp_acknowledge: true
      amqp_ack_republish_time: 300
      amqp_consumer_timeout: 15.0
      amqp_publish_retry: true
      amqp_publish_retry_max_retries: 60
      galaxy_url: "https://{{ inventory_hostname }}"
      manager: production
    # pulsar_be01:
    #   load: galaxy.jobs.runners.pulsar:PulsarMQJobRunner
    #   amqp_url: "pyamqp://pulsar_be:{{ vault_rabbitmq_password_vhost }}@127.0.0.1:5671/{{ rabbitmq_vhosts[1] }}?ssl=1"
    #   amqp_acknowledge: true
    #   amqp_ack_republish_time: 300
    #   amqp_consumer_timeout: 15.0
    #   amqp_publish_retry: true
    #   amqp_publish_retry_max_retries: 60
    #   galaxy_url: "https://{{ inventory_hostname }}"
    #   manager: test
  handling:
    assign: ['db-skip-locked']
  execution:
    default: tpv_dispatcher
    environments:
      local_env:
        runner: local_runner
        tmp_dir: true
      tpv_dispatcher:
        runner: dynamic
        type: python
        function: map_tool_to_destination
        rules_module: tpv.rules
        tpv_config_files:
          - "{{ tpv_config_dir }}/tool_defaults.yml"
          - "https://raw.githubusercontent.com/galaxyproject/tpv-shared-database/main/tools.yml"
          # - "{{ tpv_config_dir }}/destinations_shared.yml"
          - "{{ tpv_config_dir }}/destinations.yml"
          - "{{ tpv_config_dir }}/tools.yml"
          - "{{ tpv_config_dir }}/interactive_tools.yml"
          - "{{ tpv_config_dir }}/users.yml"
          - "{{ tpv_config_dir }}/roles.yml"
          # - https://raw.githubusercontent.com/galaxyproject/tpv-shared-database/main/tools.yml
          # - "{{ tpv_config_dir }}/tpv_rules_local.yml"
  resources:
    default: default
    groups:
      default: []
      testing: [cores, time]
  limits:
    - type: destination_total_concurrent_jobs
      id: local_tool
      value: 2
    - type: destination_user_concurrent_jobs
      id: local_upload
      value: 10
    - type: walltime
      value: '148:00:00'
    # Limited time for Interactive tools
    - type: output_size
      value: '300GB'
    - type: registered_user_concurrent_jobs
      value: 5
    - type: anonymous_user_concurrent_jobs
      value: 3

