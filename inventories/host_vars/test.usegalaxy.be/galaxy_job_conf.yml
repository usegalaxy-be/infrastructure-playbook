      amqp_acknowledge: true
      amqp_consumer_timeout: 15.0
      amqp_publish_retry: true
      amqp_publish_retry_max_retries: 60
      amqp_url: "pyamqp://pulsar_de01:{{ vault_rabbitmq_password_germany }}@127.0.0.1:5671//pulsar/pulsar_de01?ssl=1"
