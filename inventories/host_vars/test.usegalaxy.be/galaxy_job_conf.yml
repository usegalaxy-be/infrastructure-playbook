      galaxy_url: "https://{{ inventory_hostname }}"
      manager: test      
  handling:
    assign: ['db-skip-locked']
  execution:
    default: tpv_dispatcher
    environments:
      local_env:
        runner: local_runner
        tmp_dir: true
      tpv_dispatcher:
        runner: dynamic
        type: python
        function: map_tool_to_destination
        rules_module: tpv.rules
        tpv_config_files:
          - "{{ tpv_config_dir }}/tool_defaults.yml"
          - "https://gxy.io/tpv/db-v2.yml"
          # - "{{ tpv_config_dir }}/destinations_shared.yml"
          - "{{ tpv_config_dir }}/destinations.yml"
          - "{{ tpv_config_dir }}/tools.yml"
          - "{{ tpv_config_dir }}/interactive_tools.yml"
          - "{{ tpv_config_dir }}/users.yml"
          - "{{ tpv_config_dir }}/roles.yml"
          # - https://raw.githubusercontent.com/galaxyproject/tpv-shared-database/main/tools.yml
          # - "{{ tpv_config_dir }}/tpv_rules_local.yml"
  resources:
    default: default
    groups:
      default: []
      testing: [cores, time]
  limits:
    - type: destination_user_concurrent_jobs
      id: local_upload
      value: 10
    - type: walltime
      value: '148:00:00'
    # Limited time for Interactive tools
    - type: output_size
      value: '300GB'
    - type: registered_user_concurrent_jobs
      value: 10
    - type: anonymous_user_concurrent_jobs
      value: 1

