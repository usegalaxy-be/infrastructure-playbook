# Galaxy Job Configuration
galaxy_job_config:
  runners:
    local_runner:
      load: galaxy.jobs.runners.local:LocalJobRunner
      workers: 4
    condor:
      load: "{{ 'galaxy.jobs.runners.htcondor:HTCondorJobRunner' if galaxy_htcondor_runner else 'galaxy.jobs.runners.condor:CondorJobRunner' }}"
    pulsar_embedded:
      load: galaxy.jobs.runners.pulsar:PulsarEmbeddedJobRunner
      pulsar_config: "{{ galaxy_config_dir }}/pulsar_app.yml"
    pulsar_vib:
      load: galaxy.jobs.runners.pulsar:PulsarMQJobRunner
      amqp_url: "pyamqp://galaxy_vib:{{ vault_rabbitmq_password_vib }}@127.0.0.1:5671//pulsar/galaxy_vib?ssl=1"
      amqp_acknowledge: true
      amqp_ack_republish_time: 300
      amqp_consumer_timeout: 15.0
      amqp_publish_retry: true
      amqp_publish_retry_max_retries: 60
      galaxy_url: "https://{{ inventory_hostname }}"
      manager: test
    pulsar_be01:
      load: galaxy.jobs.runners.pulsar:PulsarMQJobRunner
      amqp_url: "pyamqp://pulsar_be:{{ vault_rabbitmq_password_vhost }}@127.0.0.1:5671/{{ rabbitmq_vhosts[1] }}?ssl=1"
      amqp_acknowledge: true
      amqp_ack_republish_time: 300
      amqp_consumer_timeout: 15.0
      amqp_publish_retry: true
      amqp_publish_retry_max_retries: 60
      galaxy_url: "https://{{ inventory_hostname }}"
      manager: test
