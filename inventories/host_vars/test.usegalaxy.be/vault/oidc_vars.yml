# Secrets fetched from HashiCorp Vault at playbook runtime.
# Requires: VAULT_ADDR and VAULT_TOKEN (or ANSIBLE_HASHI_VAULT_* AppRole variables).
_vault_oidc_test: "{{ lookup('community.hashi_vault.hashi_vault', 'vsc/prod/data/usegalaxy-be/oidc/test') }}"
vault_elixir_client_id: "{{ _vault_oidc_test.vault_elixir_client_id }}"
vault_elixir_client_secret: "{{ _vault_oidc_test.vault_elixir_client_secret }}"
