# Monitoring
# usegalaxy_eu.influxdbserver

# TODO: this variable needs to loaded by the role, make a PR
influxdb_databases:
  - galaxy
  - "{{ consumer_influx_db }}"
  - grt
  - galaxy_stats
  - notifications
  - internal_metrics

# Role: dj-wasabi.telegraf

telegraf_agent_output:
  - type: influxdb
    config:
      - urls = ["http://monitoring.usegalaxy.be:8086"]
      - database = "galaxy"
      - username = "{{ influxdb_users.regular[1].username }}"
      - password = "{{ influxdb_users.regular[1].password }}"
      - timeout = "10s"
  # ESG WP4 output removed 2026-07-08: it wrote esg-tagged metrics to the local
  # influxdb container (port 59886), which was decommissioned along with the
  # rest of the head-node monitoring stack. Last esg-tagged point: 2026-03-29.
  # Preserved data: /data/monitoring/influxdb_data (esg_tpv_broker DB).

telegraf_plugins_extra:
  postgres:
    plugin: "postgresql_extensible"
    config:
      - address = "{{ galaxy_db_connection }}"
      # TODO: move to vault?
      - databases = ["{{ vault_test_db_name }}"]

  listen_galaxy_routes:
    plugin: "statsd"
    config:
      - service_address = ":8125"
      - percentiles = [90]
      - metric_separator = "."
      - allowed_pending_messages = 10000
      - percentile_limit = 100
  
  # ESG TPV Broker metrics

  # telegraf plugin for sending pulsar metrics to influx
  # Disabled: pulsar-util role is part of an inactive research project
  # pulsar_monitor_esg:
  #   plugin: exec
