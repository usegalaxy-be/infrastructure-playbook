# Role: tpv_broker
tpv_broker_dir: "{{ galaxy_local_root }}/tpv_broker"
tpv_broker_repo: "https://github.com/usegalaxy-eu/tpv-broker.git"
tpv_broker_commit_id: "main"
tpv_broker_force_checkout: true # discards local changes if any
tpv_broker_venv_dir: "/opt/tpv_broker/venv"
tpv_broker_virtualenv_command: "{{ galaxy_virtualenv_command }}"
tpv_broker_systemd_service_name: "tpv-broker"
tpv_broker_systemd_service_user: "{{ galaxy_user_name }}"
tpv_broker_ssl_certificate: "{{ galaxy_shared_certs_dir }}/{{ galaxy_shared_cert_domain }}/fullchain.pem"
tpv_broker_ssl_certificate_key: "{{ galaxy_shared_certs_user_dir }}/{{ galaxy_shared_cert_domain }}/privkey-nginx.pem"
tpv_broker_nginx_conf: true
tpv_broker_proxy_config:
  location: "/tpv-api/"
  proxy_pass_host: "127.0.0.1"
  proxy_pass_port: 8000
  proxy_pass_protocol: "http"
