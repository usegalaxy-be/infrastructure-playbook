---
# Bring your own compute on test.usegalaxy.be: turn users' byoc_pulsar
# preferences into one PR per user with byoc-sync. Nothing is merged automatically.
# byoc-sync is pinned to a commit with the usegalaxy-be-test site until that is merged upstream.
name: BYOC sync

"on":
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only print what would change"
        type: boolean
        default: true
  schedule:
    - cron: "23 4 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: byoc-sync

jobs:
  sync:
    # needs the secrets below; never runs in forks
    if: github.repository == 'usegalaxy-be/infrastructure-playbook'
    runs-on: ubuntu-latest
    env:
      BYOC_SYNC_REPO: pauldg/elixir_biohackathon_2026_project1
      BYOC_SYNC_REF: 1fe0e73c81a775b304718c2a0b99032bedf57d12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # byoc-sync pushes with its own token
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install "byoc-sync @ git+https://github.com/${BYOC_SYNC_REPO}@${BYOC_SYNC_REF}#subdirectory=byoc-sync"

      - name: Sync
        env:
          GALAXY_API_KEY: ${{ secrets.BYOC_GALAXY_ADMIN_API_KEY }}
          BYOC_SYNC_VAULT_PASSWORD: ${{ secrets.BYOC_VAULT_PASSWORD }}
          BYOC_SYNC_FINGERPRINT_KEY: ${{ secrets.BYOC_FINGERPRINT_KEY }}
          # A bot or GitHub App token makes the opened PRs run the usual checks;
          # PRs opened with the built-in token do not.
          GITHUB_TOKEN: ${{ secrets.BYOC_GH_TOKEN || github.token }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          args=(--github-repo "$GITHUB_REPOSITORY" --base-branch "${{ github.event.repository.default_branch }}")
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          byoc-sync \
            --source api --galaxy-url https://test.usegalaxy.be \
            --repo-path . --site-config usegalaxy-be-test \
            --allow-list files/byoc/test.usegalaxy.be/allow_list.txt \
            "${args[@]}"
