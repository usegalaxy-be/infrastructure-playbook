---

# https://github.com/usegalaxy-eu/infrastructure-playbook/blob/master/roles/usegalaxy-eu.galaxy-cleanup/tasks/main.yml


- set_fact:
    plugin_config_galaxy_cleanup:
      galaxy_cleanup:
        plugin: "exec"
        config:
          - commands = ["{{ custom_telegraf_env }} /usr/bin/gxadmin galaxy cleanup 60"]
          - timeout = "1h"
          - data_format = "influx"
          - interval = "24h"

- set_fact:
        telegraf_plugins_extra: "{{ telegraf_plugins_extra | combine(plugin_config_galaxy_cleanup) }}"
