---
- name: Check for failed systemd units
  ansible.builtin.command: systemctl --failed --no-legend
  register: os_update_failed_units
  changed_when: false
  failed_when: false

- name: Report failed systemd units
  ansible.builtin.debug:
    msg: "{{ os_update_failed_units.stdout_lines | default([]) or 'No failed units.' }}"

- name: Check if a reboot is still needed
  ansible.builtin.command: needs-restarting -r
  register: os_update_reboot_still_needed
  changed_when: false
  failed_when: false

- name: Report the reboot status
  ansible.builtin.debug:
    msg: "{{ 'No reboot needed.' if os_update_reboot_still_needed.rc == 0 else 'Reboot still needed, check by hand.' }}"
