## setup cron jobs 

- name: "Create dir"
  file:
    path: "/usr/local/galaxy/galaxy-cron/"
    owner: "{{ galaxy_user }}"
    group: "{{ galaxy_group }}"
    mode: 0755
    state: directory
  become: yes
 
- name: "Send files"
  copy:
    src: "scripts/cron/"
    dest: "/usr/local/galaxy/galaxy-cron/"
    owner: "{{ galaxy_user }}"
    group: "{{ galaxy_group }}"
    mode: 0740
    directory_mode: true
 
- name: "Send backup_db from template"
  template:
    src: "templates/scripts/cron/backup_db.sh.j2"
    dest: "/usr/local/galaxy/galaxy-cron/backup_db.sh"
    owner: "{{ galaxy_user }}"
    group: "{{ galaxy_group }}"
    mode: 0740
   


# Cron jobs

#***** db backup

# make sure the backup_path exists (used to backup the database)
- name: "Create DB back up dir "
  file:
    path: "{{ backup_path }}"
    owner: "{{ galaxy_user }}"
    group: "{{ galaxy_group }}"
    mode: 0755
    state: directory
  #become: yes

# make sure the backup_path/config exists (used to backup different config files)
- name: "Create config back up dir "
  file:
    path: "{{ backup_path }}/config"
    owner: "{{ galaxy_user }}"
    group: "{{ galaxy_group }}"
    mode: 0755
    state: directory
  #become: yes

# First get the dump backup:   
- cron:
   name: "Backup DB"
   hour: "0"
   minute: "0"
   job: '/usr/local/galaxy/galaxy-cron/backup_db.sh'


# Then run the script to keep only the X latest...:  /usr/local/galaxy/galaxy-cron/handle_db_backups.sh --recent 5 /srv/galaxy/backup_db/ 
- cron:
   name: Remove old backup files
   hour: "1"
   minute: "0" 
   job: '/usr/local/galaxy/galaxy-cron/handle_db_backups.sh --daily-months {{ keep_daily_months_backups }}--recent {{ keep_recent_db_backups }} --oldest {{keep_oldest_db_backups}} {{ backup_path }}'



# Backup mutable config files. These gets modified when installing tools or DM from the tool shed. 
- cron:
   name: Backup config files
   minute: "0"
   hour: "0"
   job: '/usr/local/galaxy/galaxy-cron/backup_configs.sh {{ galaxy_mutable_config_dir }} {{ backup_path }}/config'


# Superseded by the MinIO upload in pdg.postgres-backup's backup_db.sh.
- cron:
   name: Send latest backup to remote storage (PSB shares)
   state: absent




