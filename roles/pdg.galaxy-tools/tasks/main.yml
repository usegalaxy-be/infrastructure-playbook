---
- include: install_ephemeris.yml
  when: install_ephemeris

- include: install_galaxy_tool_util.yml
  when: install_galaxy_tool_util

- include: install_tool_list.yml
  when: install_tools and galaxy_tools_install_state == 'present'

- include: remove_tool_install.yml
  when: galaxy_tools_install_state == 'absent'

- include: test_tool_list.yml
  when: test_tools


