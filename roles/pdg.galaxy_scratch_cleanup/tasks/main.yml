---
- name: Refuse object store ids that are not scratch storage
  ansible.builtin.assert:
    that:
      - galaxy_scratch_cleanup_stores | list | reject('search', 'scratch') | list | length == 0
    fail_msg: "galaxy_scratch_cleanup_stores may only list object store ids that contain 'scratch'"
    quiet: true

- name: Create the scratch cleanup log directory
  ansible.builtin.file:
    path: "{{ galaxy_scratch_cleanup_log_dir }}"
    state: directory
    owner: "{{ galaxy_scratch_cleanup_user }}"
    mode: "0755"

- name: Install the scratch cleanup service and timer
  ansible.builtin.template:
    src: "scratch-cleanup.{{ item }}.j2"
    dest: "/etc/systemd/system/{{ galaxy_scratch_cleanup_unit }}.{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - service
    - timer
  register: scratch_cleanup_units

- name: Enable or disable the scratch cleanup timer
  ansible.builtin.systemd:
    name: "{{ galaxy_scratch_cleanup_unit }}.timer"
    enabled: "{{ galaxy_scratch_cleanup_enabled | bool and galaxy_scratch_cleanup_stores | length > 0 }}"
    state: "{{ 'started' if (galaxy_scratch_cleanup_enabled | bool and galaxy_scratch_cleanup_stores | length > 0) else 'stopped' }}"
    daemon_reload: "{{ scratch_cleanup_units.changed }}"
