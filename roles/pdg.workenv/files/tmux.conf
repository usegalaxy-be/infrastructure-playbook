# ============================================================
# ~/.tmux.conf — managed by Ansible (pdg.workenv)
# ============================================================

# --- Prefix -----------------------------------------------------
# Ctrl+b — tmux default, matches all tmux documentation
set -g prefix C-b
bind C-b send-prefix   # Ctrl+b Ctrl+b sends a literal Ctrl+b to the shell

# --- Terminal & colours -----------------------------------------
set -g default-terminal "tmux-256color"

# --- Environment ------------------------------------------------
# Refresh these vars in the session when a client attaches
set -g update-environment "SSH_AUTH_SOCK GH_TOKEN ANSIBLE_VAULT_PASSWORD"

# --- Mouse ------------------------------------------------------
set -g mouse on         # click to select pane/window, drag to resize, scroll

# --- Indexing ---------------------------------------------------
set -g base-index 1         # windows start at 1 (0 is awkward on the keyboard)
setw -g pane-base-index 1
set -g renumber-windows on  # close window 2 of 1-2-3 → windows become 1-2

# --- Scrollback -------------------------------------------------
set -g history-limit 20000

# --- Responsiveness ---------------------------------------------
set -s escape-time 0    # no delay after Escape (important in vim)
set -g repeat-time 300  # window for repeatable binds (resize etc.)

# --- Reload config ----------------------------------------------
bind r source-file ~/.tmux.conf \; display "~/.tmux.conf reloaded"

# --- Splits -----------------------------------------------------
# | for horizontal split, - for vertical split, both open in current path
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New window also opens in current path
bind c new-window -c "#{pane_current_path}"

# --- Pane navigation (vim-style) --------------------------------
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes — hold prefix and tap H/J/K/L repeatedly (repeat-time window)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --- Copy mode --------------------------------------------------
setw -g mode-keys vi    # vim keybindings in copy mode (/ to search, v to select)

# --- Status bar -------------------------------------------------
set -g status-position bottom
set -g status-interval 5          # refresh every 5 seconds

set -g status-style 'bg=colour235 fg=colour136'

# Left: session name
set -g status-left "#[fg=colour166,bold] #S #[fg=colour244]│ "
set -g status-left-length 30

# Right: hostname and clock
set -g status-right "#[fg=colour244]#H  #[fg=colour136]%Y-%m-%d %H:%M "
set -g status-right-length 50

# Window list
set -g window-status-style 'fg=colour244'
set -g window-status-current-style 'fg=colour166 bold'
set -g window-status-format " #I:#W "
set -g window-status-current-format " #I:#W "

# Pane borders
set -g pane-border-style 'fg=colour238'
set -g pane-active-border-style 'fg=colour166'
